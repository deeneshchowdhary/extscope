name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Install Chromium for integration tests
        run: npx playwright install --with-deps chromium
      - name: Real-browser integration tests (loads the packaged extension)
        run: npm run test:integration
      - name: Package extension
        run: |
          cd dist
          zip -r ../extscope.zip .
      - name: Checksum the release artifact
        run: |
          shasum -a 256 extscope.zip | tee extscope.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: extscope-build
          path: |
            extscope.zip
            extscope.zip.sha256
