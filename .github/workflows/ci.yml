name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Pinned rather than ubuntu-latest: that label has been intermittently
    # serving Ubuntu 24.04, which renamed the libasound2 package
    # (libasound2 -> libasound2t64), breaking `playwright install
    # --with-deps` for the Playwright version this repo pins (see
    # SECURITY.md for why Playwright itself is pinned). ubuntu-22.04 still
    # has the old package name and is a stable target, not a moving one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Install Chromium for integration tests
        run: npx playwright install --with-deps chromium
      - name: Real-browser integration tests (loads the packaged extension)
        run: npm run test:integration
      - name: Package extension
        run: |
          cd dist
          zip -r ../extscope.zip .
      - name: Checksum the release artifact
        run: |
          shasum -a 256 extscope.zip | tee extscope.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: extscope-build
          path: |
            extscope.zip
            extscope.zip.sha256
