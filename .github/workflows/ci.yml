name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Package extension
        run: |
          cd dist
          zip -r ../ai-extension-firewall.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ai-extension-firewall-build
          path: ai-extension-firewall.zip
